<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variant A — Subtle stretch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Anton&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        h1 {
            font-family: sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }
        .pta-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.75;
            text-transform: uppercase;
            transform: rotate(-3deg);
        }
        .pta-w1 {
            font-family: 'Anton', sans-serif;
            font-size: 48px;
            color: #b8e02a;
            letter-spacing: 0.08em;
            display: block;
            text-shadow: 3px 3px 0 #1a1a1a;
            transform: rotate(2deg);
        }
        .pta-w2 {
            display: block;
            transform: rotate(-1deg);
            line-height: 0;
        }
        .pta-p-letter {
            width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .pta-w3 {
            font-family: 'Anton', sans-serif;
            font-size: 40px;
            color: #ff2d9b;
            letter-spacing: 0.1em;
            display: block;
            text-shadow: 2px 2px 0 #1a1a1a;
            transform: rotate(1deg);
        }
        .pta-w4 {
            font-family: 'Oswald', sans-serif;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3em;
            display: block;
            text-shadow: 1px 1px 0 #1a1a1a;
        }
    </style>
</head>
<body>
    <h1>Variant A — Subtle stretch</h1>
    <div class="pta-stack">
        <span class="pta-w1">PARENT</span>
        <span class="pta-w2">
            <svg class="pta-p-letter" viewBox="0 0 270 110" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow layer 1: dark teal -->
                <g transform="translate(4,4)">
                    <!-- P stem — 33px wide, 100px tall -->
                    <rect x="0" y="5" width="33" height="100" rx="3" fill="#0088aa"/>
                    <!-- P bowl — subtle 30% wider stretch, smooth round curve -->
                    <path d="M33,8 C50,8 78,6 92,14 C110,24 112,42 92,52 C78,58 50,58 33,56 Z" fill="#0088aa"/>
                </g>
                <!-- Shadow layer 2: near-black -->
                <g transform="translate(7,7)">
                    <rect x="0" y="5" width="33" height="100" rx="3" fill="#1a1a1a"/>
                    <path d="M33,8 C50,8 78,6 92,14 C110,24 112,42 92,52 C78,58 50,58 33,56 Z" fill="#1a1a1a"/>
                </g>
                <!-- Main P — cyan -->
                <rect x="0" y="5" width="33" height="100" rx="3" fill="#00e5ff"/>
                <path d="M33,8 C50,8 78,6 92,14 C110,24 112,42 92,52 C78,58 50,58 33,56 Z" fill="#00e5ff"/>
                <!-- TA text — Bangers font, sized to match 100px stem height -->
                <text x="108" y="92" font-family="'Bangers',sans-serif" font-size="100" fill="#1a1a1a" letter-spacing="3" transform="translate(4,4)">TA</text>
                <text x="108" y="92" font-family="'Bangers',sans-serif" font-size="100" fill="#00e5ff" letter-spacing="3">TA</text>
            </svg>
        </span>
        <span class="pta-w3">TEACHER</span>
        <span class="pta-w4">ASSOCIATION</span>
    </div>
</body>
</html>
