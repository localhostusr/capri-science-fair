<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Mock 1: Classic NKOTB stack — PARENT small top, TEACHER huge middle, ASSOC small bottom -->
  <!-- Blocky hand-drawn condensed letters with 3D offset -->

  <defs>
    <style>
      .shadow { fill: #1a1a1a; }
      .w1 { fill: #ffffff; }
      .w2 { fill: #fbbf24; }
      .w3 { fill: #e87fbf; }
    </style>
  </defs>

  <!-- Background for preview -->
  <rect width="300" height="300" rx="0" fill="#e8611a" opacity="0.15"/>

  <!-- PARENT — top, medium size, white -->
  <!-- 3D shadow offset -->
  <g transform="translate(3,3)">
    <!-- P -->
    <rect class="shadow" x="30" y="60" width="14" height="50"/>
    <rect class="shadow" x="30" y="60" width="30" height="10"/>
    <rect class="shadow" x="50" y="60" width="10" height="28"/>
    <rect class="shadow" x="30" y="78" width="30" height="10"/>
    <!-- A -->
    <rect class="shadow" x="68" y="60" width="14" height="50"/>
    <rect class="shadow" x="96" y="60" width="14" height="50"/>
    <rect class="shadow" x="68" y="60" width="42" height="10"/>
    <rect class="shadow" x="68" y="82" width="42" height="10"/>
    <!-- R -->
    <rect class="shadow" x="118" y="60" width="14" height="50"/>
    <rect class="shadow" x="118" y="60" width="34" height="10"/>
    <rect class="shadow" x="142" y="60" width="10" height="28"/>
    <rect class="shadow" x="118" y="78" width="34" height="10"/>
    <polygon class="shadow" points="138,88 152,110 140,110 126,88"/>
    <!-- E -->
    <rect class="shadow" x="160" y="60" width="14" height="50"/>
    <rect class="shadow" x="160" y="60" width="32" height="10"/>
    <rect class="shadow" x="160" y="80" width="28" height="10"/>
    <rect class="shadow" x="160" y="100" width="32" height="10"/>
    <!-- N -->
    <rect class="shadow" x="200" y="60" width="14" height="50"/>
    <rect class="shadow" x="234" y="60" width="14" height="50"/>
    <polygon class="shadow" points="214,60 234,110 220,110 200,60"/>
    <!-- T -->
    <rect class="shadow" x="256" y="60" width="38" height="10"/>
    <rect class="shadow" x="269" y="60" width="14" height="50"/>
  </g>
  <!-- PARENT letters -->
  <g>
    <rect class="w1" x="30" y="60" width="14" height="50"/>
    <rect class="w1" x="30" y="60" width="30" height="10"/>
    <rect class="w1" x="50" y="60" width="10" height="28"/>
    <rect class="w1" x="30" y="78" width="30" height="10"/>

    <rect class="w1" x="68" y="60" width="14" height="50"/>
    <rect class="w1" x="96" y="60" width="14" height="50"/>
    <rect class="w1" x="68" y="60" width="42" height="10"/>
    <rect class="w1" x="68" y="82" width="42" height="10"/>

    <rect class="w1" x="118" y="60" width="14" height="50"/>
    <rect class="w1" x="118" y="60" width="34" height="10"/>
    <rect class="w1" x="142" y="60" width="10" height="28"/>
    <rect class="w1" x="118" y="78" width="34" height="10"/>
    <polygon class="w1" points="138,88 152,110 140,110 126,88"/>

    <rect class="w1" x="160" y="60" width="14" height="50"/>
    <rect class="w1" x="160" y="60" width="32" height="10"/>
    <rect class="w1" x="160" y="80" width="28" height="10"/>
    <rect class="w1" x="160" y="100" width="32" height="10"/>

    <rect class="w1" x="200" y="60" width="14" height="50"/>
    <rect class="w1" x="234" y="60" width="14" height="50"/>
    <polygon class="w1" points="214,60 234,110 220,110 200,60"/>

    <rect class="w1" x="256" y="60" width="38" height="10"/>
    <rect class="w1" x="269" y="60" width="14" height="50"/>
  </g>

  <!-- TEACHER — massive, gold, dominant -->
  <g transform="translate(3,3)">
    <text class="shadow" x="150" y="185" text-anchor="middle"
          font-family="'Oswald','Impact',sans-serif" font-weight="700"
          font-size="95" letter-spacing="-2" font-stretch="condensed"
          transform="scale(0.75,1) translate(50,0)">TEACHER</text>
  </g>
  <text class="w2" x="150" y="185" text-anchor="middle"
        font-family="'Oswald','Impact',sans-serif" font-weight="700"
        font-size="95" letter-spacing="-2" font-stretch="condensed"
        transform="scale(0.75,1) translate(50,0)"
        stroke="#1a1a1a" stroke-width="3" paint-order="stroke">TEACHER</text>

  <!-- ASSOC — small bottom, pink -->
  <g transform="translate(2,2)">
    <text class="shadow" x="150" y="220" text-anchor="middle"
          font-family="'Oswald','Impact',sans-serif" font-weight="700"
          font-size="32" letter-spacing="12">ASSOC</text>
  </g>
  <text class="w3" x="150" y="220" text-anchor="middle"
        font-family="'Oswald','Impact',sans-serif" font-weight="700"
        font-size="32" letter-spacing="12"
        stroke="#1a1a1a" stroke-width="2" paint-order="stroke">ASSOC</text>
</svg>
