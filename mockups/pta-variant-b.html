<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variant B — Refined</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            color: #fff;
        }
        h1 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.45;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .container {
            position: relative;
            width: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            object-fit: contain;
            filter: saturate(0.2) brightness(1.3) opacity(0.4);
            z-index: 0;
            pointer-events: none;
        }
        .stack {
            position: relative;
            z-index: 1;
            text-align: center;
            line-height: 0.75;
            transform: rotate(-3deg);
        }
        .w-parent {
            font-family: 'Anton', sans-serif;
            font-size: 52px;
            color: #b8e02a;
            display: block;
            transform: rotate(2deg);
            text-shadow: 3px 3px 0 #1a1a1a;
            -webkit-text-stroke: 1px #1a1a1a;
        }
        .w-pta {
            display: block;
            transform: rotate(-1deg);
            margin: 4px 0;
        }
        .w-pta svg {
            width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .w-teacher {
            font-family: 'Anton', sans-serif;
            font-size: 44px;
            color: #ff2d9b;
            display: block;
            transform: rotate(1deg);
            text-shadow: 3px 3px 0 #1a1a1a;
            -webkit-text-stroke: 1px #1a1a1a;
        }
        .w-association {
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3em;
            display: block;
            margin-top: 6px;
            text-shadow: 2px 2px 0 #1a1a1a;
        }
    </style>
</head>
<body>
    <h1>Variant B — Refined</h1>
    <div class="container">
        <img src="logo.png" alt="" class="bg-logo">
        <div class="stack">
            <span class="w-parent">PARENT</span>
            <span class="w-pta">
                <!--
                    P: stem 18px wide to match Bangers T/A stroke weight.
                    Height ~88px to match Bangers 120px cap height.
                    Bowl stretches to ~x=95, moderate exaggeration.
                    Counter hole cut with evenodd fill-rule.
                    T at x=100, A at x=155 — packed tight, minimal gaps.
                    viewBox tight: 0 10 240 100
                -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 240 100">
                    <defs>
                        <style>
                            @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;display=swap');
                        </style>
                    </defs>

                    <!-- P shadow layer 2: offset (5,5) -->
                    <g transform="translate(5,5)">
                        <path fill-rule="evenodd" fill="#1a1a1a" d="
                            M 5,14
                            L 23,14
                            L 23,20
                            C 40,16 65,14 82,24
                            C 98,34 96,50 82,58
                            C 67,65 42,64 23,60
                            L 23,100
                            L 5,100
                            Z

                            M 23,30
                            C 38,27 58,26 70,32
                            C 82,38 82,46 70,52
                            C 58,57 38,56 23,52
                            Z
                        "/>
                    </g>

                    <!-- P shadow layer 1: offset (3,3) -->
                    <g transform="translate(3,3)">
                        <path fill-rule="evenodd" fill="#0088aa" d="
                            M 5,14
                            L 23,14
                            L 23,20
                            C 40,16 65,14 82,24
                            C 98,34 96,50 82,58
                            C 67,65 42,64 23,60
                            L 23,100
                            L 5,100
                            Z

                            M 23,30
                            C 38,27 58,26 70,32
                            C 82,38 82,46 70,52
                            C 58,57 38,56 23,52
                            Z
                        "/>
                    </g>

                    <!-- P main fill -->
                    <path fill-rule="evenodd" fill="#00e5ff" d="
                        M 5,14
                        L 23,14
                        L 23,20
                        C 40,16 65,14 82,24
                        C 98,34 96,50 82,58
                        C 67,65 42,64 23,60
                        L 23,100
                        L 5,100
                        Z

                        M 23,30
                        C 38,27 58,26 70,32
                        C 82,38 82,46 70,52
                        C 58,57 38,56 23,52
                        Z
                    "/>

                    <!-- T — packed tight after P -->
                    <text x="88" y="100" font-family="Bangers, cursive" font-size="110" fill="#1a1a1a"
                          transform="translate(5,5)">T</text>
                    <text x="88" y="100" font-family="Bangers, cursive" font-size="110" fill="#0088aa"
                          transform="translate(3,3)">T</text>
                    <text x="88" y="100" font-family="Bangers, cursive" font-size="110" fill="#00e5ff">T</text>

                    <!-- A — tight after T -->
                    <text x="152" y="100" font-family="Bangers, cursive" font-size="110" fill="#1a1a1a"
                          transform="translate(5,5)">A</text>
                    <text x="152" y="100" font-family="Bangers, cursive" font-size="110" fill="#0088aa"
                          transform="translate(3,3)">A</text>
                    <text x="152" y="100" font-family="Bangers, cursive" font-size="110" fill="#00e5ff">A</text>
                </svg>
            </span>
            <span class="w-teacher">TEACHER</span>
            <span class="w-association">ASSOCIATION</span>
        </div>
    </div>
</body>
</html>
