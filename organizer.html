<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Organizer — Science Fair 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bangers&family=Anton&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #e8611a;
            --primary-dark: #c85210;
            --secondary: #9cc5d4;
            --secondary-dark: #4a7d8f;
            --accent: #fbbf24;
            --magenta: #ff2d9b;
            --green: #10b981;
            --cyan: #06b6d4;
            --red: #c4342d;
            --bg: #1a2933;
            --bg-card: #243846;
            --bg-card-hi: #2d4555;
            --text: #f0e6d2;
            --text-light: #c7bfa8;
            --text-muted: #8a8270;
            --border: #f0e6d2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 20% 30%, rgba(232,97,26,0.07) 0%, transparent 50%),
                radial-gradient(circle at 75% 70%, rgba(156,197,212,0.05) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
                var(--bg);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 1;
        }

        header {
            background: var(--primary);
            color: #fff;
            padding: 24px 32px;
            border-bottom: 6px solid #1a1a1a;
            box-shadow: 0 4px 0 #1a1a1a;
            position: relative;
            z-index: 2;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(90deg, #1a1a1a 0px, #1a1a1a 20px, var(--accent) 20px, var(--accent) 40px);
        }

        .header-inner {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        header h1 {
            font-family: 'Bungee', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 3px 3px 0 #1a1a1a;
            line-height: 1;
        }

        header .subtitle {
            font-family: 'VT323', monospace;
            font-size: 18px;
            margin-top: 6px;
            opacity: 0.95;
        }

        header .restricted-tag {
            display: inline-block;
            background: #1a1a1a;
            color: var(--accent);
            padding: 3px 10px;
            font-family: 'VT323', monospace;
            font-size: 13px;
            letter-spacing: 0.06em;
            margin-top: 8px;
            border: 2px solid var(--accent);
        }

        .updated-at {
            font-family: 'VT323', monospace;
            font-size: 16px;
            background: #1a1a1a;
            padding: 4px 10px;
            color: var(--accent);
            display: inline-block;
        }

        .refresh-btn {
            background: var(--accent);
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            padding: 8px 18px;
            font-family: 'Bungee', sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0 #1a1a1a;
            transition: all 0.1s ease;
        }

        .refresh-btn:hover {
            background: #fff;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #1a1a1a;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 36px 32px;
            position: relative;
            z-index: 2;
        }

        .section-header {
            font-family: 'Bungee', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin: 32px 0 16px;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header:first-child { margin-top: 0; }

        .section-header .pill {
            font-family: 'VT323', monospace;
            font-size: 14px;
            background: var(--accent);
            color: #1a1a1a;
            padding: 2px 10px;
            letter-spacing: 0.04em;
        }

        /* KPI cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi {
            background: var(--bg-card);
            padding: 22px 24px;
            border: 3px solid var(--text);
            box-shadow: 4px 4px 0 #000;
            position: relative;
        }

        .kpi::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border: 3px solid var(--text);
        }

        .kpi-label {
            font-family: 'VT323', monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-light);
            margin-bottom: 8px;
            padding-left: 14px;
        }

        .kpi-value {
            font-family: 'Bungee', sans-serif;
            font-size: 2.4rem;
            color: var(--accent);
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
        }

        .kpi-sub {
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .kpi.green .kpi-value { color: var(--green); }
        .kpi.cyan .kpi-value { color: var(--cyan); }
        .kpi.magenta .kpi-value { color: var(--magenta); }
        .kpi.red .kpi-value { color: #ef4444; }
        .kpi.amber .kpi-value { color: var(--accent); }

        /* Charts grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card);
            padding: 24px 28px 28px;
            border: 3px solid var(--text);
            box-shadow: 4px 4px 0 #000;
            position: relative;
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: -3px;
            right: 24px;
            width: 60px;
            height: 14px;
            background: var(--accent);
            border: 3px solid var(--text);
            border-top: none;
        }

        .chart-card.wide { grid-column: span 2; }

        @media (max-width: 900px) {
            .chart-card.wide { grid-column: span 1; }
        }

        .chart-card h2 {
            font-family: 'Bungee', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .chart-card .chart-sub {
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .chart-canvas-wrap {
            position: relative;
            height: 280px;
        }

        /* Recommendations panel */
        .recos {
            background: var(--bg-card);
            padding: 24px 28px;
            border: 3px solid var(--accent);
            box-shadow: 4px 4px 0 #000;
            margin-bottom: 24px;
        }

        .reco-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .reco-list li {
            font-family: 'VT323', monospace;
            font-size: 18px;
            padding: 6px 0;
            color: var(--text);
            border-bottom: 1px dashed rgba(240,230,210,0.15);
        }

        .reco-list li::before {
            content: '➤ ';
            color: var(--accent);
            margin-right: 6px;
        }

        .reco-list li:last-child { border-bottom: none; }

        /* Loading & error */
        .loading, .error {
            text-align: center;
            padding: 60px 20px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: var(--text-light);
            background: var(--bg-card);
            border: 3px solid var(--text);
            box-shadow: 4px 4px 0 #000;
        }

        .error { color: #ef4444; }

        footer {
            text-align: center;
            padding: 28px 20px;
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 3px dashed var(--text-muted);
            margin: 32px 32px 0;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div>
            <h1>🔬 Organizer Console</h1>
            <p class="subtitle">Capri Science Fair 2026 — Live Operations</p>
            <span class="restricted-tag">🔒 RESTRICTED — TEAM ONLY</span>
        </div>
        <div style="text-align:right;">
            <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
            <div class="updated-at" style="margin-top:8px;" id="updated-at">Loading...</div>
        </div>
    </div>
</header>

<div class="container">
    <div id="organizer-content">
        <div class="loading">Loading organizer data...</div>
    </div>
</div>

<footer>
    AGGREGATED METRICS · NO PERSONAL INFO ON THIS PAGE · DO NOT SHARE THIS URL
</footer>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyajxk_HCGo8p6E0b2YUadPD9onpyoVvMmNutIhPqsRVLKeDfBnt-MBh_u0Wj5c0j-1/exec';

const PALETTE = {
    primary: '#e8611a',
    secondary: '#9cc5d4',
    secondaryDark: '#6a9aad',
    accent: '#fbbf24',
    magenta: '#ff2d9b',
    green: '#10b981',
    cyan: '#06b6d4'
};

const ALL_GRADES = ['K','1','2','3','4','5','6'];
const ALL_CATEGORIES = ['clean-water','energy','food','sustainability','health','space','animals','engineering','other'];
const CATEGORY_LABELS = {
    'clean-water':'Clean Water','energy':'Energy','food':'Food & Ag',
    'sustainability':'Sustainability','health':'Health','space':'Space',
    'animals':'Animals','engineering':'Engineering','other':'Other'
};

// Mark this browser as a team member (organizer)
function markTeam() {
    localStorage.setItem('csf-team', '1');
    alert('You are now marked as a team member. Your visits will be excluded from public counts.');
}

// Allow team-flag via URL: ?team=1
if (new URLSearchParams(location.search).get('team') === '1') {
    localStorage.setItem('csf-team', '1');
}

// Send a tracked visit ping (organizers are tagged)
function pingVisit() {
    let sid = localStorage.getItem('csf-sid');
    if (!sid) {
        sid = 'sid-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('csf-sid', sid);
    }
    const isTeam = localStorage.getItem('csf-team') === '1' ? '1' : '0';
    fetch(APPS_SCRIPT_URL + '?action=visit&sid=' + encodeURIComponent(sid) + '&team=' + isTeam + '&page=organizer', { mode: 'no-cors' });
}

async function loadStats() {
    const content = document.getElementById('organizer-content');
    content.innerHTML = '<div class="loading">Loading organizer data...</div>';
    try {
        const res = await fetch(APPS_SCRIPT_URL + '?action=organizer-stats');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderOrganizer(data);
    } catch (err) {
        content.innerHTML = '<div class="error">Could not load: ' + err.message + '</div>';
    }
}

function renderOrganizer(data) {
    const updatedAt = new Date(data.updatedAt);
    document.getElementById('updated-at').textContent = 'Updated ' + updatedAt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});

    const base = data.base || {};
    const visits = data.visits || {};

    // Recommendations
    const recos = [];
    if (data.daysRemaining > 0) {
        recos.push(`<strong>${data.daysRemaining}</strong> day${data.daysRemaining === 1 ? '' : 's'} remaining until sign-up deadline`);
    } else {
        recos.push('Sign-up deadline has passed');
    }
    if (base.total > 0 && data.dailyRate > 0) {
        recos.push(`At current rate (~${data.dailyRate.toFixed(1)}/day), projected total: <strong>${data.projectedTotal}</strong> sign-ups`);
    }
    if (data.recommendations && data.recommendations.underGrades && data.recommendations.underGrades.length) {
        recos.push(`Under-represented grades: <strong>${data.recommendations.underGrades.map(g => g === 'K' ? 'K' : 'Grade ' + g).join(', ')}</strong>`);
    }
    if (data.recommendations && data.recommendations.emptyCategories && data.recommendations.emptyCategories.length) {
        recos.push(`Categories with zero entries: <strong>${data.recommendations.emptyCategories.map(c => CATEGORY_LABELS[c] || c).join(', ')}</strong>`);
    }
    if (base.boardsNeeded > 0) {
        recos.push(`<strong>${base.boardsNeeded}</strong> tri-fold board${base.boardsNeeded === 1 ? '' : 's'} need to be picked up before event`);
    }
    if (base.powerNeeded > 0) {
        recos.push(`<strong>${base.powerNeeded}</strong> project${base.powerNeeded === 1 ? '' : 's'} require electricity at the venue`);
    }

    const content = document.getElementById('organizer-content');
    content.innerHTML = `
        <div class="section-header">Sign-Up Activity <span class="pill">${base.total || 0} total</span></div>
        <div class="kpi-grid">
            <div class="kpi"><div class="kpi-label">Sign-Ups</div><div class="kpi-value">${base.total || 0}</div><div class="kpi-sub">project entries</div></div>
            <div class="kpi cyan"><div class="kpi-label">Students</div><div class="kpi-value">${base.students || 0}</div><div class="kpi-sub">incl. group members</div></div>
            <div class="kpi magenta"><div class="kpi-label">Group Projects</div><div class="kpi-value">${base.groupCount || 0}</div><div class="kpi-sub">${base.individualCount || 0} individual</div></div>
            <div class="kpi green"><div class="kpi-label">Conversion</div><div class="kpi-value">${data.conversion ? data.conversion.toFixed(0) : '0'}%</div><div class="kpi-sub">visit → sign-up</div></div>
            <div class="kpi amber"><div class="kpi-label">Days Left</div><div class="kpi-value">${data.daysRemaining || 0}</div><div class="kpi-sub">until deadline</div></div>
        </div>

        <div class="section-header">Visitor Metrics <span class="pill">team excluded</span></div>
        <div class="kpi-grid">
            <div class="kpi cyan"><div class="kpi-label">Unique Visitors</div><div class="kpi-value">${visits.uniqueNonTeam || 0}</div><div class="kpi-sub">${visits.publicPings || 0} total page loads</div></div>
            <div class="kpi"><div class="kpi-label">Today</div><div class="kpi-value">${visits.today || 0}</div><div class="kpi-sub">visits today (public)</div></div>
            <div class="kpi green"><div class="kpi-label">Last 7 Days</div><div class="kpi-value">${visits.last7Days || 0}</div><div class="kpi-sub">public visits</div></div>
            <div class="kpi amber"><div class="kpi-label">Team Pings</div><div class="kpi-value">${visits.teamPings || 0}</div><div class="kpi-sub">your testing visits</div></div>
        </div>

        <div class="section-header">Recommendations <span class="pill">action items</span></div>
        <div class="recos">
            <ul class="reco-list">
                ${recos.map(r => '<li>' + r + '</li>').join('')}
            </ul>
        </div>

        <div class="section-header">Activity Distribution</div>
        <div class="charts-grid">
            <div class="chart-card wide">
                <h2>Sign-Up Trend</h2>
                <p class="chart-sub">Daily sign-up volume over time</p>
                <div class="chart-canvas-wrap"><canvas id="trend-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h2>By Grade</h2>
                <p class="chart-sub">Where entries are concentrated by grade level</p>
                <div class="chart-canvas-wrap"><canvas id="grade-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h2>By Category</h2>
                <p class="chart-sub">Where entries are concentrated by topic</p>
                <div class="chart-canvas-wrap"><canvas id="cat-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h2>Day-of Resource Demand</h2>
                <p class="chart-sub">Boards and power requested</p>
                <div class="chart-canvas-wrap"><canvas id="needs-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h2>Language Mix</h2>
                <p class="chart-sub">Form usage by language</p>
                <div class="chart-canvas-wrap"><canvas id="lang-chart"></canvas></div>
            </div>
        </div>

        <div style="text-align:center; margin-top: 24px; font-family: 'VT323', monospace; font-size: 14px; color: var(--text-muted);">
            <button class="refresh-btn" onclick="markTeam()" style="background:var(--secondary); margin-top: 8px;">Tag this browser as TEAM</button>
        </div>
    `;

    renderCharts(data);
}

function renderCharts(data) {
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#c7bfa8';
    const grid = 'rgba(255,255,255,0.08)';

    const base = data.base || {};
    const visits = data.visits || {};

    // === Sign-Up Trend ===
    const dayKeys = Object.keys(data.byDay || {}).sort();
    new Chart(document.getElementById('trend-chart'), {
        type: 'bar',
        data: {
            labels: dayKeys,
            datasets: [{
                label: 'Sign-ups',
                data: dayKeys.map(k => data.byDay[k]),
                backgroundColor: PALETTE.primary,
                borderRadius: 0,
                borderSkipped: false,
                maxBarThickness: 40,
                minBarLength: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } },
                x: { grid: { display: false } }
            }
        }
    });

    // === Grade ===
    const gradeData = ALL_GRADES.map(g => base.byGrade && base.byGrade[g] ? base.byGrade[g] : 0);
    const gradeColors = gradeData.map(c => c === 0 ? '#3a4d5a' : PALETTE.primary);
    new Chart(document.getElementById('grade-chart'), {
        type: 'bar',
        data: {
            labels: ALL_GRADES.map(g => g === 'K' ? 'K' : 'Gr ' + g),
            datasets: [{ data: gradeData, backgroundColor: gradeColors, maxBarThickness: 40, minBarLength: 4 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } },
                x: { grid: { display: false } }
            }
        }
    });

    // === Category ===
    const catSorted = ALL_CATEGORIES.slice().sort((a, b) => {
        const ca = (base.byCategory && base.byCategory[a]) || 0;
        const cb = (base.byCategory && base.byCategory[b]) || 0;
        return cb - ca;
    });
    const catData = catSorted.map(c => (base.byCategory && base.byCategory[c]) || 0);
    const catColors = catData.map(c => c === 0 ? '#3a4d5a' : PALETTE.cyan);
    new Chart(document.getElementById('cat-chart'), {
        type: 'bar',
        data: {
            labels: catSorted.map(c => CATEGORY_LABELS[c] || c),
            datasets: [{ data: catData, backgroundColor: catColors, maxBarThickness: 40, minBarLength: 4 }]
        },
        options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } },
                y: { grid: { display: false } }
            }
        }
    });

    // === Needs ===
    new Chart(document.getElementById('needs-chart'), {
        type: 'bar',
        data: {
            labels: ['Boards', 'Power'],
            datasets: [{
                data: [base.boardsNeeded || 0, base.powerNeeded || 0],
                backgroundColor: [PALETTE.accent, PALETTE.green],
                maxBarThickness: 60, minBarLength: 4
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } },
                x: { grid: { display: false } }
            }
        }
    });

    // === Language ===
    new Chart(document.getElementById('lang-chart'), {
        type: 'doughnut',
        data: {
            labels: ['English', 'Español'],
            datasets: [{
                data: [(base.languages && base.languages.en) || 0, (base.languages && base.languages.es) || 0],
                backgroundColor: [PALETTE.primary, PALETTE.cyan],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { color: '#c7bfa8', padding: 16, usePointStyle: true, pointStyle: 'circle' } }
            }
        }
    });
}

pingVisit();
loadStats();
setInterval(loadStats, 60000);
</script>

</body>
</html>
