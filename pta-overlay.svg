<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 148 66" width="310" height="138">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;display=swap');
        </style>
    </defs>

    <!-- PARENT -->
    <text x="74" y="10" text-anchor="middle" font-family="Anton, sans-serif" font-size="18" fill="#1a1a1a" transform="translate(2,2)" letter-spacing="2.7">PARENT</text>
    <text x="74" y="10" text-anchor="middle" font-family="Anton, sans-serif" font-size="18" fill="#b8e02a" letter-spacing="2.7">PARENT</text>

    <!-- P shadow 2 -->
    <g transform="translate(16,4)">
        <path fill-rule="evenodd" fill="#1a1a1a" d="
            M 3,12 L 48,12 C 78,12 78,42 48,42 L 15,42 L 15,64 L 3,64 Z
            M 15,22 L 44,22 C 62,22 62,32 44,32 L 15,32 Z
        "/>
    </g>
    <!-- P shadow 1 -->
    <g transform="translate(14,2)">
        <path fill-rule="evenodd" fill="#0088aa" d="
            M 3,12 L 48,12 C 78,12 78,42 48,42 L 15,42 L 15,64 L 3,64 Z
            M 15,22 L 44,22 C 62,22 62,32 44,32 L 15,32 Z
        "/>
    </g>
    <!-- P main -->
    <g transform="translate(12,0)">
        <path fill-rule="evenodd" fill="#00e5ff" d="
            M 3,12 L 48,12 C 78,12 78,42 48,42 L 15,42 L 15,64 L 3,64 Z
            M 15,22 L 44,22 C 62,22 62,32 44,32 L 15,32 Z
        "/>
    </g>

    <!-- T -->
    <text x="68" y="64" font-family="Bangers, cursive" font-size="74" fill="#1a1a1a" transform="translate(4,4)">T</text>
    <text x="68" y="64" font-family="Bangers, cursive" font-size="74" fill="#0088aa" transform="translate(2,2)">T</text>
    <text x="68" y="64" font-family="Bangers, cursive" font-size="74" fill="#00e5ff">T</text>

    <!-- A -->
    <text x="92" y="64" font-family="Bangers, cursive" font-size="74" fill="#1a1a1a" transform="translate(4,4)">A</text>
    <text x="92" y="64" font-family="Bangers, cursive" font-size="74" fill="#0088aa" transform="translate(2,2)">A</text>
