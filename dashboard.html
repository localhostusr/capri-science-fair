<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Fair Dashboard — Capri 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Bungee&family=Bangers&family=Anton&family=VT323&family=Major+Mono+Display&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #e8611a;
            --primary-light: #f27432;
            --primary-dark: #c85210;
            --secondary: #9cc5d4;
            --secondary-dark: #4a7d8f;
            --accent: #fbbf24;
            --magenta: #ff2d9b;
            --green: #10b981;
            --cyan: #06b6d4;
            --bg: #fdf6e3;
            --bg-card: #fffaee;
            --bg-dark: #1a2933;
            --text: #1a1a1a;
            --text-light: #4a4a4a;
            --text-muted: #6a6a6a;
            --border: #1a1a1a;
            --shadow: 4px 4px 0 #1a1a1a;
            --shadow-lg: 6px 6px 0 #1a1a1a;
            --shadow-orange: 4px 4px 0 #c85210;
            --shadow-blue: 4px 4px 0 #4a7d8f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background:
                /* atomic dots pattern */
                radial-gradient(circle at 15% 25%, rgba(232,97,26,0.08) 0%, transparent 8%),
                radial-gradient(circle at 80% 60%, rgba(74,125,143,0.08) 0%, transparent 10%),
                radial-gradient(circle at 50% 90%, rgba(251,191,36,0.08) 0%, transparent 8%),
                /* graph paper grid */
                linear-gradient(rgba(74,125,143,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,125,143,0.06) 1px, transparent 1px),
                var(--bg);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Subtle scanlines overlay for CRT vibe */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.02) 0px,
                rgba(0,0,0,0.02) 1px,
                transparent 1px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 28px 32px;
            border-bottom: 6px solid var(--bg-dark);
            position: relative;
            box-shadow: 0 4px 0 var(--bg-dark);
            z-index: 2;
        }

        /* Decorative diagonal stripes on header */
        header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                #1a1a1a 0px,
                #1a1a1a 20px,
                var(--accent) 20px,
                var(--accent) 40px
            );
        }

        header .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        header h1 {
            font-family: 'Bungee', 'Bangers', sans-serif;
            font-size: 2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 3px 3px 0 #1a1a1a;
            line-height: 1;
        }

        header .subtitle {
            font-family: 'VT323', monospace;
            font-size: 18px;
            opacity: 0.95;
            font-weight: 400;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }

        header .header-meta {
            font-size: 12px;
            text-align: right;
            opacity: 0.95;
        }

        .updated-at {
            font-family: 'VT323', monospace;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 16px;
            background: #1a1a1a;
            padding: 4px 10px;
            display: inline-block;
            color: var(--accent);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px;
            position: relative;
            z-index: 2;
        }

        /* KPI cards — retro readouts */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi {
            background: var(--bg-card);
            padding: 22px 24px;
            border: 3px solid #1a1a1a;
            box-shadow: var(--shadow);
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .kpi:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #1a1a1a;
        }

        /* Top-left corner tag — like a gauge label */
        .kpi::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border: 3px solid #1a1a1a;
        }

        .kpi-label {
            font-family: 'VT323', monospace;
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
            margin-bottom: 8px;
            padding-left: 14px;
        }

        .kpi-value {
            font-family: 'Bungee', 'Bangers', sans-serif;
            font-size: 2.6rem;
            font-weight: 400;
            color: var(--text);
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
        }

        .kpi-sub {
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.04em;
        }

        .kpi.kpi-orange::before { background: var(--primary); }
        .kpi.kpi-orange .kpi-value { color: var(--primary); }
        .kpi.kpi-blue::before { background: var(--secondary-dark); }
        .kpi.kpi-blue .kpi-value { color: var(--secondary-dark); }
        .kpi.kpi-magenta::before { background: var(--magenta); }
        .kpi.kpi-magenta .kpi-value { color: var(--magenta); }
        .kpi.kpi-green::before { background: var(--green); }
        .kpi.kpi-green .kpi-value { color: var(--green); }
        .kpi.kpi-amber::before { background: var(--accent); }
        .kpi.kpi-amber .kpi-value { color: #b45309; }

        /* Charts — lab control panel cards */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--bg-card);
            padding: 24px 28px 28px;
            border: 3px solid #1a1a1a;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* Tape label on top of each card */
        .chart-card::before {
            content: '';
            position: absolute;
            top: -3px;
            right: 24px;
            width: 60px;
            height: 14px;
            background: var(--accent);
            border: 3px solid #1a1a1a;
            border-top: none;
        }

        .chart-card h2 {
            font-family: 'Bungee', 'Bangers', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .chart-card .chart-sub {
            font-family: 'VT323', monospace;
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }

        .chart-canvas-wrap {
            position: relative;
            height: 280px;
        }

        .chart-card.wide {
            grid-column: span 2;
        }

        /* Heatmap grid */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .heatmap-grid.heatmap-categories {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .heatmap-cell {
            border: 3px solid #1a1a1a;
            padding: 16px 12px;
            text-align: center;
            transition: transform 0.15s ease;
            position: relative;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 3px 3px 0 #1a1a1a;
        }

        .heatmap-cell:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1a1a1a;
        }

        .heatmap-cell-label {
            font-family: 'VT323', monospace;
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .heatmap-cell-value {
            font-family: 'Bungee', 'Bangers', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1;
        }

        @media (max-width: 900px) {
            .chart-card.wide {
                grid-column: span 1;
            }
            .heatmap-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Loading & error */
        .loading, .error {
            text-align: center;
            padding: 60px 20px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: var(--text-light);
            background: var(--bg-card);
            border: 3px solid #1a1a1a;
            box-shadow: var(--shadow);
        }

        .error {
            color: #c4342d;
            background: #fff8f8;
        }

        /* Footer — like a vintage TV credits roll */
        footer {
            text-align: center;
            padding: 36px 20px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            color: var(--text-muted);
            background: var(--bg-dark);
            color: #d4d4aa;
            margin-top: 48px;
            border-top: 6px solid var(--accent);
            position: relative;
            z-index: 2;
            line-height: 1.6;
            letter-spacing: 0.04em;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent);
        }

        footer a:hover {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }

        /* Refresh button — chunky lab control */
        .refresh-btn {
            background: var(--accent);
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            padding: 8px 18px;
            font-family: 'Bungee', 'Bangers', sans-serif;
            font-size: 13px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            box-shadow: 3px 3px 0 #1a1a1a;
            transition: all 0.1s ease;
        }

        .refresh-btn:hover {
            background: #ffffff;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #1a1a1a;
        }

        .refresh-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #1a1a1a;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div>
            <h1>🔬 Science Fair Dashboard</h1>
            <p class="subtitle">Capri Elementary 2026 — "Science Brings Us Together"</p>
        </div>
        <div class="header-meta">
            <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
            <div class="updated-at" style="margin-top:8px;" id="updated-at">Loading...</div>
        </div>
    </div>
</header>

<div class="container">
    <div id="dashboard-content">
        <div class="loading">Loading sign-up data...</div>
    </div>
</div>

<footer>
    Aggregated, anonymized stats only. No personal information is shown on this dashboard.<br>
    <a href="index.html">← Back to sign-up page</a>
</footer>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyajxk_HCGo8p6E0b2YUadPD9onpyoVvMmNutIhPqsRVLKeDfBnt-MBh_u0Wj5c0j-1/exec';

const PALETTE = {
    primary: '#e8611a',
    primaryLight: '#f27432',
    secondary: '#9cc5d4',
    secondaryDark: '#6a9aad',
    accent: '#fbbf24',
    magenta: '#ff2d9b',
    green: '#10b981',
    purple: '#8b5cf6',
    cyan: '#06b6d4',
    pink: '#f472b6'
};

const CATEGORY_COLORS = {
    'clean-water': '#06b6d4',
    'energy': '#fbbf24',
    'food': '#10b981',
    'sustainability': '#84cc16',
    'health': '#ef4444',
    'space': '#8b5cf6',
    'animals': '#f59e0b',
    'engineering': '#6a9aad',
    'other': '#94a3b8',
    'uncategorized': '#cbd5e1'
};

const CATEGORY_LABELS = {
    'clean-water': 'Clean Water',
    'energy': 'Energy',
    'food': 'Food & Agriculture',
    'sustainability': 'Sustainability',
    'health': 'Health & Body',
    'space': 'Space & Weather',
    'animals': 'Animals & Nature',
    'engineering': 'Engineering',
    'other': 'Other',
    'uncategorized': 'No category'
};

async function loadStats() {
    const content = document.getElementById('dashboard-content');
    content.innerHTML = '<div class="loading">Loading sign-up data...</div>';

    try {
        const response = await fetch(APPS_SCRIPT_URL + '?action=stats');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const stats = await response.json();
        renderDashboard(stats);
    } catch (err) {
        console.error(err);
        content.innerHTML = '<div class="error">Could not load stats: ' + err.message + '</div>';
    }
}

// Always-visible baseline lists — every grade and category shows even with 0 entries
const ALL_GRADES = ['K', '1', '2', '3', '4', '5', '6'];
const ALL_CATEGORIES = ['clean-water', 'energy', 'food', 'sustainability', 'health', 'space', 'animals', 'engineering', 'other'];

function renderDashboard(stats) {
    const updatedAt = stats.updatedAt ? new Date(stats.updatedAt) : new Date();
    document.getElementById('updated-at').textContent = 'Updated ' + updatedAt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});

    const content = document.getElementById('dashboard-content');
    content.innerHTML = `
        <div class="kpi-grid">
            <div class="kpi kpi-orange">
                <div class="kpi-label">Total Sign-Ups</div>
                <div class="kpi-value">${stats.total}</div>
                <div class="kpi-sub">project submissions</div>
            </div>
            <div class="kpi kpi-blue">
                <div class="kpi-label">Students Participating</div>
                <div class="kpi-value">${stats.students}</div>
                <div class="kpi-sub">incl. group members</div>
            </div>
            <div class="kpi kpi-magenta">
                <div class="kpi-label">Group Projects</div>
                <div class="kpi-value">${stats.groupCount}</div>
                <div class="kpi-sub">${stats.individualCount} individual</div>
            </div>
            <div class="kpi kpi-amber">
                <div class="kpi-label">Boards Needed</div>
                <div class="kpi-value">${stats.boardsNeeded}</div>
                <div class="kpi-sub">tri-fold requests</div>
            </div>
            <div class="kpi kpi-green">
                <div class="kpi-label">Power Needed</div>
                <div class="kpi-value">${stats.powerNeeded}</div>
                <div class="kpi-sub">electricity requests</div>
            </div>
        </div>

        <!-- Heatmaps -->
        <div class="charts-grid">
            <div class="chart-card wide">
                <h2>Grade Heatmap</h2>
                <p class="chart-sub">Where the action is right now — cells brighten where entries are concentrated</p>
                <div class="heatmap-grid" id="grade-heatmap"></div>
            </div>

            <div class="chart-card wide">
                <h2>Category Heatmap</h2>
                <p class="chart-sub">Where the action is right now — cells brighten where entries are concentrated</p>
                <div class="heatmap-grid heatmap-categories" id="category-heatmap"></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>By Grade</h2>
                <p class="chart-sub">All grades shown — bars rise where entries are concentrated</p>
                <div class="chart-canvas-wrap"><canvas id="grade-chart"></canvas></div>
            </div>

            <div class="chart-card">
                <h2>Group vs Individual</h2>
                <p class="chart-sub">Project format breakdown</p>
                <div class="chart-canvas-wrap"><canvas id="group-chart"></canvas></div>
            </div>

            <div class="chart-card wide">
                <h2>By Project Category</h2>
                <p class="chart-sub">All topics shown — bars extend where entries are concentrated</p>
                <div class="chart-canvas-wrap"><canvas id="category-chart"></canvas></div>
            </div>

            <div class="chart-card">
                <h2>Language Preference</h2>
                <p class="chart-sub">English vs Spanish form usage</p>
                <div class="chart-canvas-wrap"><canvas id="lang-chart"></canvas></div>
            </div>

            <div class="chart-card">
                <h2>Day-of Needs</h2>
                <p class="chart-sub">Boards & power requirements</p>
                <div class="chart-canvas-wrap"><canvas id="needs-chart"></canvas></div>
            </div>
        </div>
    `;

    renderHeatmaps(stats);
    renderCharts(stats);
}

function renderHeatmaps(stats) {
    // === Grade Heatmap ===
    const gradeContainer = document.getElementById('grade-heatmap');
    const maxGrade = Math.max(1, ...ALL_GRADES.map(g => stats.byGrade[g] || 0));
    gradeContainer.innerHTML = ALL_GRADES.map(g => {
        const count = stats.byGrade[g] || 0;
        const intensity = count === 0 ? 0 : (0.25 + (count / maxGrade) * 0.75);
        const bg = count === 0
            ? 'background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0;'
            : `background: rgba(232,97,26,${intensity}); color: ${intensity > 0.5 ? '#fff' : '#1a1a1a'}; border-color: rgba(232,97,26,${Math.min(1, intensity + 0.2)});`;
        return `
            <div class="heatmap-cell" style="${bg}">
                <div class="heatmap-cell-label">${g === 'K' ? 'K' : 'Gr ' + g}</div>
                <div class="heatmap-cell-value">${count}</div>
            </div>
        `;
    }).join('');

    // === Category Heatmap ===
    const catContainer = document.getElementById('category-heatmap');
    const maxCat = Math.max(1, ...ALL_CATEGORIES.map(c => stats.byCategory[c] || 0));
    catContainer.innerHTML = ALL_CATEGORIES.map(c => {
        const count = stats.byCategory[c] || 0;
        const baseColor = CATEGORY_COLORS[c] || '#94a3b8';
        const intensity = count === 0 ? 0 : (0.3 + (count / maxCat) * 0.7);
        const bg = count === 0
            ? 'background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0;'
            : `background: ${hexToRgba(baseColor, intensity)}; color: ${intensity > 0.55 ? '#fff' : '#1a1a1a'}; border-color: ${baseColor};`;
        return `
            <div class="heatmap-cell" style="${bg}">
                <div class="heatmap-cell-label">${CATEGORY_LABELS[c] || c}</div>
                <div class="heatmap-cell-value">${count}</div>
            </div>
        `;
    }).join('');
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}

function renderCharts(stats) {
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#555';

    // ===== Grade Chart — always show all grades K-6, grey for empty =====
    const gradeData = ALL_GRADES.map(g => stats.byGrade[g] || 0);
    const gradeColors = gradeData.map(c => c === 0 ? '#e2e8f0' : PALETTE.primary);

    new Chart(document.getElementById('grade-chart'), {
        type: 'bar',
        data: {
            labels: ALL_GRADES.map(g => g === 'K' ? 'K' : 'Gr ' + g),
            datasets: [{
                data: gradeData,
                backgroundColor: gradeColors,
                borderRadius: 0,
                borderSkipped: false,
                barThickness: 'flex',
                maxBarThickness: 40,
                minBarLength: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });

    // ===== Group vs Individual =====
    new Chart(document.getElementById('group-chart'), {
        type: 'doughnut',
        data: {
            labels: ['Group', 'Individual'],
            datasets: [{
                data: [stats.groupCount, stats.individualCount],
                backgroundColor: [PALETTE.magenta, PALETTE.secondaryDark],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle' } }
            }
        }
    });

    // ===== Category Chart — show ALL categories, sorted by count then name =====
    const catSorted = ALL_CATEGORIES.slice().sort((a, b) => {
        const ca = stats.byCategory[a] || 0;
        const cb = stats.byCategory[b] || 0;
        if (cb !== ca) return cb - ca;
        return a.localeCompare(b);
    });
    const catLabels = catSorted.map(k => CATEGORY_LABELS[k] || k);
    const catData = catSorted.map(k => stats.byCategory[k] || 0);
    const catColors = catSorted.map(k => {
        const count = stats.byCategory[k] || 0;
        return count === 0 ? '#e2e8f0' : (CATEGORY_COLORS[k] || PALETTE.primary);
    });

    new Chart(document.getElementById('category-chart'), {
        type: 'bar',
        data: {
            labels: catLabels,
            datasets: [{
                data: catData,
                backgroundColor: catColors,
                borderRadius: 0,
                borderSkipped: false,
                barThickness: 'flex',
                maxBarThickness: 50,
                minBarLength: 4
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f0f0f0' } },
                y: { grid: { display: false } }
            }
        }
    });

    // ===== Language Chart =====
    new Chart(document.getElementById('lang-chart'), {
        type: 'doughnut',
        data: {
            labels: ['English', 'Español'],
            datasets: [{
                data: [stats.languages.en || 0, stats.languages.es || 0],
                backgroundColor: [PALETTE.primary, PALETTE.cyan],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle' } }
            }
        }
    });

    // ===== Needs Chart =====
    new Chart(document.getElementById('needs-chart'), {
        type: 'bar',
        data: {
            labels: ['Boards', 'Power'],
            datasets: [{
                label: 'Requested',
                data: [stats.boardsNeeded, stats.powerNeeded],
                backgroundColor: [PALETTE.accent, PALETTE.green],
                borderRadius: 0,
                borderSkipped: false,
                maxBarThickness: 60
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });
}

loadStats();
// Auto-refresh every 60 seconds
setInterval(loadStats, 60000);
</script>

</body>
</html>
